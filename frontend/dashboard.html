<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro Core Bancário - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .modal {
            transition: opacity 0.25s ease;
        }

        body.modal-active {
            overflow: hidden;
        }
    </style>
</head>

<body class="bg-slate-900 text-white font-sans min-h-screen flex items-center justify-center">

    <!-- Container Principal -->
    <div class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 relative m-4">

        <!-- Cabeçalho -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <p class="text-xs text-slate-400 tracking-wider uppercase font-semibold">Olá, bem-vindo!</p>
                <h1 id="nomeUsuario" class="text-2xl font-bold text-emerald-400">Carregando...</h1>
            </div>
            <!-- Botão Configurações (Deletar Conta) -->
            <button id="btnConfig"
                class="p-2 bg-slate-700 hover:bg-rose-600 rounded-xl transition-colors duration-200 group"
                title="Deletar Conta">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-300 group-hover:text-white"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            </button>
        </div>

        <!-- Card de Saldo -->
        <div class="bg-slate-900 p-5 rounded-xl border border-slate-700 mb-6">
            <p class="text-xs text-slate-400 font-medium uppercase tracking-wide">Saldo Disponível</p>
            <p class="text-3xl font-black mt-1 text-white">R$ <span id="saldoUsuario">0,00</span></p>
        </div>

        <!-- Grid de Ações -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <!-- Botão Pix -->
            <button id="btnAbrirPix"
                class="flex flex-col items-center justify-center p-4 bg-slate-700 hover:bg-slate-600 rounded-xl transition-all active:scale-95 border border-slate-600">
                <div class="p-2 bg-emerald-500/10 rounded-lg mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-emerald-400" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <span class="text-xs font-semibold">Enviar Pix</span>
            </button>

            <!-- Botão Depositar -->
            <button id="btnAbrirDeposito"
                class="flex flex-col items-center justify-center p-4 bg-slate-700 hover:bg-slate-600 rounded-xl transition-all active:scale-95 border border-slate-600">
                <div class="p-2 bg-amber-500/10 rounded-lg mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-amber-400" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </div>
                <span class="text-xs font-semibold">Depositar</span>
            </button>

            <!-- Botão Extrato -->
            <button id="btnAbrirExtrato"
                class="flex flex-col items-center justify-center p-4 bg-slate-700 hover:bg-slate-600 rounded-xl transition-all active:scale-95 border border-slate-600">
                <div class="p-2 bg-blue-500/10 rounded-lg mb-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-400" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                    </svg>
                </div>
                <span class="text-xs font-semibold">Ver Extrato</span>
            </button>
        </div>

        <!-- Logout -->
        <div class="text-center">
            <button id="btnLogout"
                class="text-sm text-slate-400 hover:text-rose-400 font-medium transition-colors">Desconectar da
                conta</button>
        </div>
    </div>

    <!-- MODAL: DEPÓSITO -->
    <div id="modalDeposito"
        class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-slate-950/70 backdrop-blur-sm"></div>
        <div
            class="modal-container bg-slate-800 w-11/12 max-w-sm mx-auto rounded-2xl shadow-2xl z-50 border border-slate-700 p-6">
            <h3 class="text-xl font-bold text-amber-400 mb-2">Fazer Depósito</h3>
            <p class="text-xs text-slate-400 mb-4">Adicione saldo à sua conta corrente.</p>
            <form id="formDeposito">
                <div class="mb-4">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Valor
                        (R$)</label>
                    <input type="number" id="valorDeposito" placeholder="0.00" step="0.01" min="0.01"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500 font-bold text-lg"
                        required />
                </div>
                <div class="flex space-x-3 mt-6">
                    <button type="button" id="btnFecharDeposito"
                        class="w-1/2 p-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-semibold text-sm transition-colors">Cancelar</button>
                    <button type="submit"
                        class="w-1/2 p-3 bg-amber-500 hover:bg-amber-600 text-slate-950 rounded-xl font-bold text-sm transition-colors">Confirmar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: PIX -->
    <div id="modalPix"
        class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-slate-950/70 backdrop-blur-sm"></div>
        <div
            class="modal-container bg-slate-800 w-11/12 max-w-sm mx-auto rounded-2xl shadow-2xl z-50 border border-slate-700 p-6">
            <h3 class="text-xl font-bold text-emerald-400 mb-2">Enviar Pix</h3>
            <p class="text-xs text-slate-400 mb-4">Transfira saldo instantaneamente para outra conta.</p>
            <form id="formPix">
                <div class="mb-3">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">E-mail do
                        Destinatário</label>
                    <input type="email" id="destinatarioPix" placeholder="exemplo@email.com"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500 text-sm"
                        required />
                </div>
                <div class="mb-3">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Valor
                        (R$)</label>
                    <input type="number" id="valorPix" placeholder="0.00" step="0.01" min="0.01"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500 font-bold text-lg"
                        required />
                </div>
                <div class="mb-4">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Senha
                        Transacional (4 dígitos)</label>
                    <input type="password" id="senhaPix" placeholder="****" maxlength="4"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500 tracking-widest font-mono text-center text-lg"
                        required />
                </div>
                <div class="flex space-x-3 mt-6">
                    <button type="button" id="btnFecharPix"
                        class="w-1/2 p-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-semibold text-sm transition-colors">Cancelar</button>
                    <button type="submit"
                        class="w-1/2 p-3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 rounded-xl font-bold text-sm transition-colors">Confirmar
                        Pix</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modalExtrato"
        class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-slate-950/70 backdrop-blur-sm"></div>
        <div
            class="modal-container bg-slate-800 w-11/12 max-w-md mx-auto rounded-2xl shadow-2xl z-50 border border-slate-700 p-6 flex flex-col max-h-[80vh]">
            <h3 class="text-xl font-bold text-blue-400 mb-1">Extrato da Conta</h3>
            <p class="text-xs text-slate-400 mb-4">Histórico completo de transações.</p>

          
            <div id="listaTransacoes" class="flex-1 overflow-y-auto space-y-2 pr-1 min-h-[200px] max-h-[400px]">
                <p class="text-sm text-slate-400 text-center py-4">Nenhuma movimentação encontrada.</p>
            </div>

            <div class="mt-6">
                <button type="button" id="btnFecharExtrato"
                    class="w-full p-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-semibold text-sm transition-colors">Fechar
                    Extrato</button>
            </div>
        </div>
    </div>

    
    <script src="deshboard.js" defer></script>
</body>

</html>
