<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar - Micro-core Bancário</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body
    class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between p-4 relative overflow-x-hidden">

    <div id="toastContainer"
        class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full px-4 md:px-0 pointer-events-none"></div>

    <header class="max-w-5xl w-full mx-auto py-4 flex justify-start items-center flex-shrink-0">
        <div class="flex items-center gap-2">
            <div class="bg-indigo-600 p-2 rounded-lg text-white">
                <i data-lucide="wallet" class="w-5 h-5"></i>
            </div>
            <span class="font-bold text-base tracking-wider text-indigo-400">MICRO-CORE</span>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center w-full my-8">
        <div
            class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 md:p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute -right-16 -top-16 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl"></div>

            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-white tracking-tight">Abra sua conta</h2>
                <p class="text-xs text-slate-400 mt-1">Cadastre-se para acessar o ecossistema Micro-core</p>
            </div>

            <form id="formCadastro" class="flex flex-col gap-5">

                <div>
                    <label for="name"
                        class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Nome Completo</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i data-lucide="user" class="w-4 h-4"></i>
                        </span>
                        <input type="text" id="name" required placeholder="Seu nome"
                            class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl pl-10 pr-4 py-3 text-white text-sm outline-none transition">
                    </div>
                </div>

                <div>
                    <label for="email"
                        class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">E-mail</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </span>
                        <input type="email" id="email" required placeholder="seu@email.com"
                            class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl pl-10 pr-4 py-3 text-white text-sm outline-none transition">
                    </div>
                </div>

                <div>
                    <label for="password"
                        class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Senha de Acesso</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                        </span>
                        <input type="password" id="password" required placeholder="Crie uma senha forte"
                            class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl pl-10 pr-4 py-3 text-white text-sm outline-none transition">
                    </div>
                </div>

                <div>
                    <label for="transactionPin"
                        class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Senha Transacional (PIN de 4 dígitos)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500">
                            <i data-lucide="key-round" class="w-4 h-4"></i>
                        </span>
                        <input type="password" id="transactionPin" maxlength="4" pattern="\d{4}" required
                            placeholder="••••"
                            class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl pl-10 pr-4 py-3 text-white text-sm outline-none transition text-center tracking-widest">
                    </div>
                    <p class="text-[10px] text-slate-500 mt-1">Usada para autorizar transferências Pix e saques.</p>
                </div>

                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-indigo-600/20 mt-2 flex items-center justify-center gap-2 group">
                    Cadastrar Conta
                    <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                </button>
            </form>

            <div class="text-center mt-6 text-sm text-slate-400">
                Já tem uma conta? <a href="login.html"
                    class="text-indigo-400 hover:text-indigo-300 hover:underline transition">Acesse aqui</a>
            </div>
        </div>
    </main>

    <footer class="py-4 text-center text-xs text-slate-600 flex-shrink-0 border-t border-slate-900">
        © 2026 Micro-core Bancário. Sistema seguro e criptografado.
    </footer>

    <script>
        window.showToast = function (mensagem, tipo = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `flex items-center gap-3 p-4 rounded-xl border shadow-2xl transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto`;

            if (tipo === 'success') {
                toast.className += ' bg-slate-900 border-emerald-500/30 text-slate-100';
                toast.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5 text-emerald-400 flex-shrink-0"></i> <span class="text-sm font-medium">${mensagem}</span>`;
            } else {
                toast.className += ' bg-slate-900 border-rose-500/30 text-slate-100';
                toast.innerHTML = `<i data-lucide="alert-circle" class="w-5 h-5 text-rose-400 flex-shrink-0"></i> <span class="text-sm font-medium">${mensagem}</span>`;
            }

            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 50);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }
    </script>

    <script>
        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const transactionPin = document.getElementById('transactionPin').value;

            if (transactionPin.length !== 4 || isNaN(Number(transactionPin))) {
                window.showToast('⚠️ O PIN transacional deve conter exatamente 4 números.', 'error');
                return;
            }

            try {
                const response = await fetch('https://micro-core-bancario-backend.onrender.com/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name,
                        email,
                        password,
                        transactionPin
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    window.showToast('🎉 Conta criada com sucesso! Redirecionando...', 'success');

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    window.showToast(data.error || data.message || 'Erro ao registrar conta.', 'error');
                }
            } catch (error) {
                console.error('Erro ao conectar com a API:', error);
                window.showToast('⚠️ Erro de conexão com o servidor back-end.', 'error');
            }
        });

        lucide.createIcons();
    </script>
</body>

</html>
