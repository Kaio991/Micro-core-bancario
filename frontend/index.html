<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar sua Conta - PixApp</title>
  
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        <h2 class="text-3xl font-bold text-center text-emerald-400 mb-2">PixApp</h2>
        <p class="text-slate-400 text-center mb-6 text-sm">Crie sua conta e comece a transacionar</p>

       
        <form id="formCadastro" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Nome Completo</label>
                <input type="text" id="nome" required placeholder="Ex: João Silva"
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-400 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">E-mail</label>
                <input type="email" id="email" required placeholder="seu@email.com"
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-400 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Senha (Password)</label>
                <input type="password" id="password" required placeholder="••••••••"
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-400 transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">PIN de Segurança (4
                    dígitos)</label>
                <input type="password" id="pin" required maxlength="4" pattern="\d{4}" placeholder="1234"
                    class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-center text-xl font-bold tracking-widest text-emerald-400 focus:outline-none focus:border-emerald-400 transition">
                <span class="text-[10px] text-slate-500 block mt-1">Usado para autorizar suas transferências via
                    Pix.</span>
            </div>

            <button type="submit"
                class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold p-3 rounded-lg transition mt-6 shadow-lg shadow-emerald-500/20">
                Cadastrar Conta
            </button>
        </form>

        <div class="text-center mt-6 text-sm text-slate-400">
            Já tem uma conta? <a href="./login.html" class="text-emerald-400 hover:underline">Faça o login</a>
        </div>
    </div>


    <script>
        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault();

            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const pin = document.getElementById('pin').value;

            try {
                
                const response = await fetch('http://localhost:3000/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name:nome, email:email, password:password, transactionPin:pin })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Cadastro realizado com sucesso! Redirecionando...');
                    window.location.href = './login.html';
                } else {
                    alert('Erro no cadastro: ' + (data.message || 'Tente novamente.'));
                }
            } catch (error) {
                console.error('Erro ao conectar com a API:', error);
                alert('Erro ao conectar com o servidor back-end.');
            }
        });
    </script>
</body>

</html>
